services:
  magi:
    build: .
    image: magi-document-utilities
    container_name: magi-document-utilities
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional: require "X-API-Key: <value>" on /api/**
      MAGI_API_KEY: ""
    # Chromium needs a bit more shared memory than Docker's 64 MB default
    shm_size: "512mb"
    init: true
